<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Tacos el Colorado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">

    <div class="flex items-center gap-3 px-4 py-4 border-b border-gray-800 sticky top-0 bg-gray-900 z-10">
        <button id="btn-atras" class="text-gray-400 hover:text-white text-2xl">←</button>
        <h1 id="titulo-vista" class="text-xl font-extrabold flex-1">⚙️ Administrador</h1>
    </div>

    <div id="vista-menu" class="px-4 py-6 space-y-4 max-w-md mx-auto">
        <button id="btn-ir-trabajadores" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-2xl p-5 text-left flex items-center gap-4">
            <span class="text-3xl">👤</span>
            <div>
                <p class="text-lg font-bold">Trabajadores</p>
                <p class="text-sm text-gray-400">Alias, rol y color</p>
            </div>
        </button>
        <button id="btn-ir-productos" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-2xl p-5 text-left flex items-center gap-4">
            <span class="text-3xl">🏷️</span>
            <div>
                <p class="text-lg font-bold">Precios y productos</p>
                <p class="text-sm text-gray-400">Tacos y bebidas</p>
            </div>
        </button>
        <button id="btn-ir-historial" class="hidden w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-2xl p-5 text-left flex items-center gap-4">
            <span class="text-3xl">📊</span>
            <div>
                <p class="text-lg font-bold">Historial</p>
                <p class="text-sm text-gray-400">Ventas y cierres de caja</p>
            </div>
        </button>
    </div>
    <div id="vista-trabajadores" class="hidden px-4 py-6 max-w-md mx-auto space-y-3"></div>
    <script>
        const SUPABASE_URL = "https://sscfugtmwhdtjwlrwfzr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_D8pajZjVyJWO-u7u3OsnKw_RGqKPOBO";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioRol = null;

        async function verificarSesion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }

            const { data: perfil } = await supabaseClient
                .from('perfiles').select('rol').eq('id', user.id).single();

            if (!perfil || !['administrador', 'superadministrador'].includes(perfil.rol)) {
                alert('No tienes permiso para ver esta página.');
                window.location.href = 'inicio.html';
                return;
            }
            usuarioRol = perfil.rol;

            if (usuarioRol === 'superadministrador') {
                document.getElementById('btn-ir-historial').classList.remove('hidden');
            }
        }
        verificarSesion();

        function mostrarVistaMenu() {
            document.querySelectorAll('[id^="vista-"]').forEach(v => v.classList.add('hidden'));
            document.getElementById('vista-menu').classList.remove('hidden');
            document.getElementById('titulo-vista').textContent = '⚙️ Administrador';
            document.getElementById('btn-atras').onclick = () => window.location.href = 'inicio.html';
        }
        const ROLES_EDITABLES = ['mesero', 'cajero', 'cocinero', 'administrador'];
        const COLORES = [
            { nombre: 'Rojo', hex: '#ef4444' }, { nombre: 'Azul', hex: '#3b82f6' },
            { nombre: 'Verde', hex: '#22c55e' }, { nombre: 'Amarillo', hex: '#eab308' },
            { nombre: 'Morado', hex: '#a855f7' }, { nombre: 'Rosa', hex: '#ec4899' },
            { nombre: 'Naranja', hex: '#f97316' }, { nombre: 'Cian', hex: '#06b6d4' },
            { nombre: 'Indigo', hex: '#6366f1' }, { nombre: 'Gris', hex: '#6b7280' }
        ];

        function mostrarVistaTrabajadores() {
            document.querySelectorAll('[id^="vista-"]').forEach(v => v.classList.add('hidden'));
            document.getElementById('vista-trabajadores').classList.remove('hidden');
            document.getElementById('titulo-vista').textContent = '👤 Trabajadores';
            document.getElementById('btn-atras').onclick = mostrarVistaMenu;
            cargarTrabajadores();
        }

        async function cargarTrabajadores() {
            const { data: usuarios, error } = await supabaseClient
                .from('perfiles').select('id, nombre_completo, alias, color, rol')
                .neq('rol', 'superadministrador')
                .neq('rol', 'invitado')
                .order('nombre_completo');

            const cont = document.getElementById('vista-trabajadores');
            if (error) { cont.innerHTML = `<p class="text-red-400">${error.message}</p>`; return; }
            if (!usuarios || usuarios.length === 0) { cont.innerHTML = `<p class="text-gray-400 text-center">No hay trabajadores.</p>`; return; }

            cont.innerHTML = '';
            usuarios.forEach(u => cont.appendChild(crearFilaTrabajador(u)));
        }
        function crearFilaTrabajador(u) {
            const wrap = document.createElement('div');
            wrap.className = 'bg-gray-800 border border-gray-700 rounded-2xl overflow-hidden';

            const colorActual = (u.color || '#6b7280');
            const header = document.createElement('button');
            header.className = 'w-full p-4 flex items-center gap-3 text-left';
            header.innerHTML = `
                <div class="w-5 h-5 rounded-full border-2 border-white shrink-0" style="background-color:${colorActual}"></div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold truncate">${u.alias || u.nombre_completo || 'Sin nombre'}</p>
                    <p class="text-xs text-gray-400 capitalize">${u.rol}</p>
                </div>
                <span class="expand-arrow text-xl text-gray-400">▾</span>
            `;

            const panel = document.createElement('div');
            panel.className = 'hidden border-t border-gray-700 p-4 space-y-4';
            panel.innerHTML = `
                <div>
                    <p class="text-sm text-gray-400 mb-1">Alias</p>
                    <input type="text" class="input-alias w-full bg-gray-900 border border-gray-700 rounded-xl p-2" value="${u.alias || ''}" placeholder="Nombre corto para mostrar">
                </div>
                <div>
                    <p class="text-sm text-gray-400 mb-1">Rol</p>
                    <div class="grid grid-cols-2 gap-2 roles-cont"></div>
                </div>
                <div>
                    <p class="text-sm text-gray-400 mb-1">Color</p>
                    <div class="flex flex-wrap gap-2 colores-cont"></div>
                </div>
                <button class="btn-guardar-trabajador w-full bg-green-700 hover:bg-green-600 rounded-xl py-2 font-bold">Guardar</button>
            `;

            const rolesCont = panel.querySelector('.roles-cont');
            let rolSel = u.rol;
            ROLES_EDITABLES.forEach(r => {
                const b = document.createElement('button');
                b.textContent = r.charAt(0).toUpperCase() + r.slice(1);
                b.className = 'rounded-xl py-2 text-sm bg-gray-700';
                if (r === rolSel) b.style.backgroundColor = '#ca8a04';
                b.addEventListener('click', () => {
                    rolSel = r;
                    rolesCont.querySelectorAll('button').forEach(x => x.style.backgroundColor = '');
                    b.style.backgroundColor = '#ca8a04';
                });
                rolesCont.appendChild(b);
            });

            const coloresCont = panel.querySelector('.colores-cont');
            let colorSel = colorActual;
            COLORES.forEach(c => {
                const chip = document.createElement('button');
                chip.className = 'w-9 h-9 rounded-full';
                chip.style.backgroundColor = c.hex;
                if (c.hex.toLowerCase() === colorActual.toLowerCase()) chip.style.boxShadow = '0 0 0 3px white';
                chip.addEventListener('click', () => {
                    colorSel = c.hex;
                    coloresCont.querySelectorAll('button').forEach(x => x.style.boxShadow = '');
                    chip.style.boxShadow = '0 0 0 3px white';
                });
                coloresCont.appendChild(chip);
            });

            header.addEventListener('click', () => {
                panel.classList.toggle('hidden');
                header.querySelector('.expand-arrow').textContent = panel.classList.contains('hidden') ? '▾' : '▴';
            });

            panel.querySelector('.btn-guardar-trabajador').addEventListener('click', async () => {
                const alias = panel.querySelector('.input-alias').value.trim() || null;
                const { error } = await supabaseClient.from('perfiles')
                    .update({ alias, rol: rolSel, color: colorSel }).eq('id', u.id);
                if (error) { alert('Error: ' + error.message); return; }
                cargarTrabajadores();
            });

            wrap.appendChild(header);
            wrap.appendChild(panel);
            return wrap;
        }document.getElementById('btn-ir-trabajadores').addEventListener('click', mostrarVistaTrabajadores);
    </script>
</body>
</html>
