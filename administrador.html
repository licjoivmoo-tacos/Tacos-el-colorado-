<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador - Tacos el Colorado</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-md mx-auto p-4">
  <div class="flex items-center justify-between mb-6">
    <a href="inicio.html" class="text-2xl">←</a>
    <h1 class="text-xl font-bold">Colores de mesero</h1>
    <div class="w-6"></div>
  </div>
  <div id="lista-usuarios" class="space-y-4">
    <p class="text-gray-400 text-center">Cargando usuarios...</p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://sscfugtmwhdtjwlrwfzr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_D8pajZjVyJWO-u7u3OsnKw_RGqKPOBO";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const COLORES = [
  { nombre: 'Rojo', hex: '#ef4444' },
  { nombre: 'Azul', hex: '#3b82f6' },
  { nombre: 'Verde', hex: '#22c55e' },
  { nombre: 'Amarillo', hex: '#eab308' },
  { nombre: 'Morado', hex: '#a855f7' },
  { nombre: 'Rosa', hex: '#ec4899' },
  { nombre: 'Naranja', hex: '#f97316' },
  { nombre: 'Cian', hex: '#06b6d4' },
  { nombre: 'Indigo', hex: '#6366f1' },
  { nombre: 'Gris', hex: '#6b7280' }
];

async function init() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }

  const { data: perfil } = await supabaseClient.from('perfiles')
    .select('rol').eq('id', session.user.id).single();

  if (!perfil || perfil.rol !== 'administrador') {
    alert('No tienes permiso para ver esta página.');
    window.location.href = 'inicio.html';
    return;
  }

  cargarUsuarios();
}

async function cargarUsuarios() {
  const { data: usuarios, error } = await supabaseClient.from('perfiles')
    .select('id, nombre_completo, color, rol')
    .in('rol', ['mesero', 'cajero', 'administrador'])
    .order('nombre_completo');

  const cont = document.getElementById('lista-usuarios');

  if (error) {
    cont.innerHTML = `<p class="text-red-400 text-center">Error: ${error.message}</p>`;
    return;
  }
  if (!usuarios || usuarios.length === 0) {
    cont.innerHTML = `<p class="text-gray-400 text-center">No hay usuarios.</p>`;
    return;
  }

  cont.innerHTML = '';
  usuarios.forEach(u => {
    const colorActual = (u.color || '#6b7280').toLowerCase();

    const div = document.createElement('div');
    div.className = 'bg-gray-800 rounded-xl p-4';

    const header = document.createElement('div');
    header.className = 'flex items-center gap-3 mb-3';
    header.innerHTML = `
      <div class="w-6 h-6 rounded-full border-2 border-white" style="background-color:${colorActual}"></div>
      <div>
        <p class="font-bold">${u.nombre_completo || 'Sin nombre'}</p>
        <p class="text-xs text-gray-400 capitalize">${u.rol}</p>
      </div>`;

    const chipsCont = document.createElement('div');
    chipsCont.className = 'flex flex-wrap gap-2';

    COLORES.forEach(c => {
      const chip = document.createElement('button');
      const seleccionado = colorActual === c.hex.toLowerCase();
      chip.className = 'w-8 h-8 rounded-full' + (seleccionado ? ' ring-2 ring-white' : '');
      chip.style.backgroundColor = c.hex;
      chip.title = c.nombre;
      chip.addEventListener('click', async () => {
        const { error } = await supabaseClient.from('perfiles')
          .update({ color: c.hex }).eq('id', u.id);
        if (error) { alert('Error: ' + error.message); return; }
        cargarUsuarios();
      });
      chipsCont.appendChild(chip);
    });

    div.appendChild(header);
    div.appendChild(chipsCont);
    cont.appendChild(div);
  });
}

init();
</script>
</body>
</html>
