<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos el Colorado - Comedor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden flex flex-col">

    <div class="flex items-center gap-4 px-6 py-3 border-b border-gray-800 shrink-0">
        <button onclick="window.location.href='cocina-menu.html'" class="text-gray-400 hover:text-white text-3xl">←</button>
        <h1 class="text-3xl font-extrabold">🍽️ Comedor</h1>
        <span id="reloj" class="ml-auto text-xl text-gray-400 font-mono"></span>
    </div>

    <div id="grid-platos" class="flex-1 grid grid-cols-3 grid-rows-2 gap-4 p-4 overflow-hidden"></div>

    <script>
        const SUPABASE_URL = "https://sscfugtmwhdtjwlrwfzr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_D8pajZjVyJWO-u7u3OsnKw_RGqKPOBO";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function verificarSesion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }

            const { data: perfil } = await supabaseClient
                .from('perfiles').select('rol').eq('id', user.id).single();
            if (!perfil || !['cocinero', 'cajero', 'administrador', 'superadministrador'].includes(perfil.rol)) {
                alert('No tienes permiso para ver esta página.');
                window.location.href = 'index.html';
                return;
            }
            cargarPendientes();
            suscribirRealtime();
        }
        verificarSesion();

        setInterval(() => {
            document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        function formatHora(iso) {
            return new Date(iso).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        }

        function describirTaco(t) {
            const extras = [];
            if (t.tortilla === 'grande') extras.push('tortilla grande');
            if (t.textura_tortilla !== 'blandita') extras.push(t.textura_tortilla);

            let tipos = [...t.tipos];
            let nombreTipos;
            if (tipos.includes('longaniza') && tipos.includes('suadero')) {
                tipos = tipos.filter(x => x !== 'longaniza' && x !== 'suadero');
                tipos.push('campechano');
            }
            nombreTipos = tipos.join(' + ');

            if (t.tipos.includes('longaniza') && t.longaniza_estilo === 'dorada') extras.push('longaniza dorada');

            if (t.cebolla && t.cilantro) extras.push('con verdura');
            else if (t.cebolla) extras.push('solo cebolla');
            else if (t.cilantro) extras.push('solo cilantro');
            else extras.push('sin verdura');

            return { nombreTipos, extraTexto: extras.join(', ') };
        }let coloresMesero = {};

        async function cargarColoresMesero(ids) {
            const faltantes = [...new Set(ids)].filter(id => id && !coloresMesero[id]);
            if (faltantes.length === 0) return;
            const { data } = await supabaseClient.from('perfiles').select('id, nombre_completo, color').in('id', faltantes);
            (data || []).forEach(p => { coloresMesero[p.id] = { color: p.color || '#6b7280', nombre: p.nombre_completo || 'Sin nombre' }; });
        }

        async function cargarPendientes() {
            const grid = document.getElementById('grid-platos');

            const { data: tacos } = await supabaseClient
                .from('tacos').select('*')
                .eq('enviado', true).eq('preparado', false)
                .order('hora_enviado');

            if (!tacos || tacos.length === 0) {
                grid.innerHTML = '';
                for (let i = 0; i < 6; i++) {
                    grid.innerHTML += `<div class="rounded-3xl border-4 border-dashed border-gray-800 flex items-center justify-center text-gray-700 text-2xl">Vacío</div>`;
                }
                return;
            }

            const platoIds = [...new Set(tacos.map(t => t.plato_id))];
            const { data: platos } = await supabaseClient
                .from('platos').select('id, pedido_id, notas').in('id', platoIds);

            const pedidoIds = [...new Set((platos || []).map(p => p.pedido_id))];
            const { data: pedidos } = await supabaseClient
                .from('pedidos').select('id, mesa_numero').in('id', pedidoIds).not('mesa_numero', 'is', null);

            const pedidoPorId = {};
            (pedidos || []).forEach(p => { pedidoPorId[p.id] = p; });
            const platoPorId = {};
            (platos || []).forEach(p => { if (pedidoPorId[p.pedido_id]) platoPorId[p.id] = p; });

            await cargarColoresMesero(tacos.map(t => t.mesero_id));

            const tacosPorPlato = {};
            tacos.forEach(t => {
                if (!platoPorId[t.plato_id]) return;
                if (!tacosPorPlato[t.plato_id]) tacosPorPlato[t.plato_id] = [];
                tacosPorPlato[t.plato_id].push(t);
            });

            // Prioridad por mesa: la hora del primer taco pendiente de esa mesa
            const horaMinimaPorMesa = {};
            Object.entries(tacosPorPlato).forEach(([platoId, lineas]) => {
                const mesa = pedidoPorId[platoPorId[platoId].pedido_id].mesa_numero;
                const horaMin = Math.min(...lineas.map(t => new Date(t.hora_enviado).getTime()));
                if (!horaMinimaPorMesa[mesa] || horaMin < horaMinimaPorMesa[mesa]) {
                    horaMinimaPorMesa[mesa] = horaMin;
                }
            });

            const entradas = Object.entries(tacosPorPlato).map(([platoId, lineas]) => {
                const mesa = pedidoPorId[platoPorId[platoId].pedido_id].mesa_numero;
                const horaPlato = Math.min(...lineas.map(t => new Date(t.hora_enviado).getTime()));
                return { platoId, lineas, mesa, horaMesa: horaMinimaPorMesa[mesa], horaPlato };
            });

            entradas.sort((a, b) => a.horaMesa - b.horaMesa || a.horaPlato - b.horaPlato);

            const visibles = entradas.slice(0, 6);
            grid.innerHTML = '';

            for (let i = 0; i < 6; i++) {
                if (!visibles[i]) {
                    grid.innerHTML += `<div class="rounded-3xl border-4 border-dashed border-gray-800 flex items-center justify-center text-gray-700 text-2xl">Vacío</div>`;
                    continue;
                }
                const { platoId, lineas, mesa } = visibles[i];
                const plato = platoPorId[platoId];
                const primerTaco = lineas[0];
                const info = coloresMesero[primerTaco.mesero_id] || { color: '#6b7280', nombre: 'Desconocido' };

                const lineasHtml = lineas.map(t => {
                    const { nombreTipos, extraTexto } = describirTaco(t);
                    return `<div class="flex items-center gap-3 bg-black/25 rounded-2xl p-2 mb-2">
                        <span class="text-4xl font-black shrink-0">${t.cantidad}</span>
                        <div class="min-w-0">
                            <p class="text-xl font-bold capitalize truncate">${nombreTipos}</p>
                            <p class="text-sm text-gray-300 truncate">${extraTexto}</p>
                        </div>
                    </div>`;
                }).join('');

                const notaHtml = plato.notas ? `<p class="mt-1 bg-yellow-900/60 border border-yellow-700 text-yellow-200 rounded-xl p-1.5 text-sm">📝 ${plato.notas}</p>` : '';

                const card = document.createElement('div');
                card.className = 'rounded-3xl p-3 border-4 flex flex-col overflow-hidden';
                card.style.borderColor = info.color;
                card.style.backgroundColor = info.color + '22';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-2xl font-extrabold">Mesa ${mesa}</p>
                        <p class="text-lg font-mono text-gray-300">${formatHora(primerTaco.hora_enviado)}</p>
                    </div>
                    <div class="flex-1 overflow-hidden">${lineasHtml}</div>
                    ${notaHtml}
                    <p class="text-xs text-gray-400 mt-1">${info.nombre}</p>
                    <button data-plato-id="${platoId}" class="btn-preparado w-full mt-2 bg-green-700 hover:bg-green-600 rounded-2xl py-3 text-xl font-extrabold">
                        ✓ Preparado
                    </button>
                `;
                grid.appendChild(card);
            }

            document.querySelectorAll('.btn-preparado').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const platoId = btn.dataset.platoId;
                    const ahora = new Date().toISOString();
                    await supabaseClient.from('tacos')
                        .update({ preparado: true, hora_preparado: ahora })
                        .eq('plato_id', platoId);
                });
            });
        }function suscribirRealtime() {
            supabaseClient
                .channel('comedor-tacos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tacos' }, cargarPendientes)
                .subscribe();
        }
    </script>
</body>
</html>
