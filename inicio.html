<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tacos el Colorado - Mesas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">

    <!-- Header con logo y menú oculto -->
    <div class="relative flex flex-col items-center pt-6 pb-4 border-b border-gray-800">
        <button id="btn-logo" class="focus:outline-none">
            <img src="https://i.ibb.co/gbCxqN6V/1000068301.png" alt="Tacos el Colorado"
                 class="w-16 h-16 object-contain rounded-full shadow-lg bg-gray-800 p-1 mx-auto">
        </button>
        <h1 class="text-lg font-bold mt-2">Tacos el Colorado</h1>

        <!-- Menú desplegable oculto -->
        <div id="menu-oculto" class="hidden absolute top-full mt-2 w-48 bg-gray-800 border border-gray-700 rounded-xl shadow-xl overflow-hidden z-20">
            <button data-vista="mesas" class="menu-item w-full text-left px-4 py-3 hover:bg-gray-700 transition flex items-center gap-2">
                🍽️ Mesas
            </button>
            <button data-vista="caja" id="item-caja" class="menu-item hidden w-full text-left px-4 py-3 hover:bg-gray-700 transition flex items-center gap-2 border-t border-gray-700">
                💰 Caja
            </button><button data-vista="cocina" id="item-cocina" class="menu-item hidden w-full text-left px-4 py-3 hover:bg-gray-700 transition flex items-center gap-2 border-t border-gray-700">
                🔥 Cocina
            </button>
            <button data-vista="administrador" id="item-admin" class="menu-item hidden w-full text-left px-4 py-3 hover:bg-gray-700 transition flex items-center gap-2 border-t border-gray-700">
                ⚙️ Administrador
            </button>
        </div>
    </div>

    <!-- Vista: Mesas -->
    <div id="vista-mesas" class="px-4 py-6">
        <h2 class="text-center text-gray-400 text-sm uppercase tracking-wide mb-4">Selecciona una mesa</h2>
        <div id="grid-mesas" class="grid grid-cols-3 gap-3 max-w-md mx-auto"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://sscfugtmwhdtjwlrwfzr.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_D8pajZjVyJWO-u7u3OsnKw_RGqKPOBO";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const TOTAL_MESAS = 11;
        const gridMesas = document.getElementById('grid-mesas');

        // --- Verificación de sesión ---
        async function verificarSesion() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }

            const { data: perfil } = await supabaseClient
                .from('perfiles').select('rol').eq('id', user.id).single();
            if (!perfil || perfil.rol === 'invitado') {
                window.location.href = 'index.html';
                return;
            }

            if (perfil.rol === 'cocinero') {
                window.location.href = 'cocina-menu.html';
                return;
            }

            const puedeVerCaja = ['cajero', 'administrador', 'superadministrador'].includes(perfil.rol);
            const puedeVerCocina = ['cajero', 'administrador', 'superadministrador'].includes(perfil.rol);
            const puedeVerAdmin = ['administrador', 'superadministrador'].includes(perfil.rol);

            if (puedeVerCaja) document.getElementById('item-caja').classList.remove('hidden');
            if (puedeVerCocina) document.getElementById('item-cocina').classList.remove('hidden');
            if (puedeVerAdmin) document.getElementById('item-admin').classList.remove('hidden');

            iniciarMesas();
        }
        verificarSesion();
        // --- Menú oculto ---
        const btnLogo = document.getElementById('btn-logo');
        const menuOculto = document.getElementById('menu-oculto');

        btnLogo.addEventListener('click', () => menuOculto.classList.toggle('hidden'));

        document.addEventListener('click', (e) => {
            if (!btnLogo.contains(e.target) && !menuOculto.contains(e.target)) {
                menuOculto.classList.add('hidden');
            }
        });

        document.querySelectorAll('.menu-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const seccion = btn.dataset.vista;
                menuOculto.classList.add('hidden');
                if (seccion === 'administrador') window.location.href = 'administrador.html';
                else if (seccion === 'caja') window.location.href = 'caja.html';
                else if (seccion === 'cocina') window.location.href = 'cocina-menu.html';
            });
        });

        // --- Mesas y Barra: números especiales 101-104 para las 4 sillas de barra ---
        const SILLAS_BARRA = [101, 102, 103, 104];
        const TODOS_NUMEROS = [...Array.from({length: TOTAL_MESAS}, (_, i) => i + 1), ...SILLAS_BARRA];
        const mesaEls = {};

        function iniciarMesas() {
            gridMesas.innerHTML = '';

            for (let i = 1; i <= TOTAL_MESAS; i++) {
                const mesaBtn = document.createElement('button');
                mesaBtn.className = "relative aspect-square bg-gray-800 border-2 border-gray-700 rounded-2xl flex flex-col items-center justify-center gap-1 transition active:scale-95";
                mesaBtn.innerHTML = `
                    <span class="punto-rojo hidden absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full border-2 border-gray-900"></span>
                    <span class="text-3xl">🍽️</span>
                    <span class="text-sm font-semibold text-gray-300">Mesa ${i}</span>
                `;
                mesaBtn.addEventListener('click', () => {
                    window.location.href = `servicio.html?mesa=${i}`;
                });
                gridMesas.appendChild(mesaBtn);
                mesaEls[i] = { el: mesaBtn, puntoEl: mesaBtn.querySelector('.punto-rojo') };
            }

            // Tarjeta especial: Mesa Barra (4 sillas independientes)
            const barraCard = document.createElement('div');
            barraCard.className = "aspect-square bg-gray-800 border-2 border-gray-700 rounded-2xl p-2 flex flex-col";
            barraCard.innerHTML = `
                <span class="text-xs text-center text-gray-400 font-semibold mb-1">Barra</span>
                <div class="grid grid-cols-2 gap-1 flex-1" id="grid-sillas-barra"></div>
            `;
            gridMesas.appendChild(barraCard);
            const gridSillas = barraCard.querySelector('#grid-sillas-barra');

            SILLAS_BARRA.forEach((num, idx) => {
                const sillaBtn = document.createElement('button');
                sillaBtn.className = "relative bg-gray-700 border border-gray-600 rounded-lg flex items-center justify-center transition active:scale-95";
                sillaBtn.innerHTML = `
                    <span class="punto-rojo hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-gray-900"></span>
                    <span class="text-xs font-semibold text-gray-300">${idx + 1}</span>
                `;
                sillaBtn.addEventListener('click', () => {
                    window.location.href = `servicio.html?mesa=${num}`;
                });
                gridSillas.appendChild(sillaBtn);
                mesaEls[num] = { el: sillaBtn, puntoEl: sillaBtn.querySelector('.punto-rojo') };
            });

            // Cuadro extra: Para llevar
            const paraLlevarBtn = document.createElement('button');
            paraLlevarBtn.className = "aspect-square bg-yellow-900 hover:bg-yellow-800 border border-yellow-700 rounded-2xl flex flex-col items-center justify-center gap-1 transition active:scale-95";
            paraLlevarBtn.innerHTML = `
                <span class="text-3xl">🚚</span>
                <span class="text-sm font-semibold text-yellow-200">Para llevar</span>
            `;
            paraLlevarBtn.addEventListener('click', () => window.location.href = 'servicio.html');
            gridMesas.appendChild(paraLlevarBtn);

            cargarEstadoMesas();
            suscribirRealtime();
        }// --- Cargar color de mesero + punto rojo por mesa/silla ---
        async function cargarEstadoMesas() {
            const { data: pedidosActivos } = await supabaseClient
                .from('pedidos')
                .select('id, mesa_numero, mesero_id')
                .not('mesa_numero', 'is', null)
                .in('estado', ['abierto', 'cuenta_pedida']);

            TODOS_NUMEROS.forEach(num => {
                mesaEls[num].el.style.borderColor = '';
                mesaEls[num].puntoEl.classList.add('hidden');
            });

            if (!pedidosActivos || pedidosActivos.length === 0) return;

            const meseroIds = [...new Set(pedidosActivos.map(p => p.mesero_id))];
            const { data: perfiles } = await supabaseClient
                .from('perfiles').select('id, color').in('id', meseroIds);
            const colorPorMesero = {};
            (perfiles || []).forEach(p => { colorPorMesero[p.id] = p.color || '#6b7280'; });

            const pedidoIds = pedidosActivos.map(p => p.id);
            const { data: tacos } = await supabaseClient
                .from('tacos').select('pedido_id, enviado').in('pedido_id', pedidoIds);
            const { data: bebidas } = await supabaseClient
                .from('bebidas').select('pedido_id, enviado').in('pedido_id', pedidoIds);
            const items = [...(tacos || []), ...(bebidas || [])];

            pedidosActivos.forEach(p => {
                const mesaEl = mesaEls[p.mesa_numero];
                if (!mesaEl) return;

                const color = colorPorMesero[p.mesero_id] || '#6b7280';
                mesaEl.el.style.borderColor = color;

                const itemsPedido = items.filter(it => it.pedido_id === p.id);
                const hayEnviados = itemsPedido.some(it => it.enviado);
                const hayPendientes = itemsPedido.some(it => !it.enviado);
                if (hayEnviados && hayPendientes) {
                    mesaEl.puntoEl.classList.remove('hidden');
                }
            });
        }

        // --- Realtime: refrescar cuando algo cambie ---
        function suscribirRealtime() {
            supabaseClient
                .channel('inicio-mesas')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, cargarEstadoMesas)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tacos' }, cargarEstadoMesas)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'bebidas' }, cargarEstadoMesas)
                .subscribe();
        }
    </script>
</body>
</html>
